<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161614" media="(prefers-color-scheme: dark)" />
    <title>Reinforcement learning — weights and wires</title>
    <meta
      name="description"
      content="A hands-on reinforcement learning course, from bandits to the post-training of language, image, speech, and robot models, with an editor and a check runner beside every lesson."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'%3E%3Crect width='24' height='24' rx='6' fill='%231c1b18'/%3E%3Ccircle cx='7' cy='12' r='2.4' fill='%23f7f6f2'/%3E%3Crect x='14.2' y='9.6' width='4.8' height='4.8' rx='1' fill='%23f7f6f2'/%3E%3Cpath d='M8.2 9.4C10 6.2 14 6 16.4 8.4M15.8 14.8C14 17.8 10 18 7.8 14.8' stroke='%23f7f6f2' stroke-width='1.4' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the stored theme before the first paint. src/lib/theme.ts owns
      // the same key and keeps it in step afterwards.
      (function () {
        var mode = null;
        try {
          mode = localStorage.getItem("rl.theme");
        } catch (e) {}
        var dark =
          mode === "dark" ||
          (mode !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
